<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A5A" />
      <stop offset="100%" style="stop-color:#FFBC94" />
    </linearGradient>
  </defs>
  
  <!-- Perfect Circular Background -->
  <circle cx="200" cy="200" r="200" fill="#0c1421" />
  
  <!-- Polished SC Monogram -->
  <g transform="translate(200, 200)">
    <!-- The "C" (Claw) - Centered and Wrapping -->
    <path d="M 60 -110 
             A 125 125 0 1 0 60 110 
             L 110 140
             A 170 170 0 1 1 110 -140 
             Z" 
          fill="url(#brand-grad)" 
          transform="translate(-30, 0)" />
    
    <!-- The "S" - Pure White -->
    <path d="M -40 -60 
             L -10 -60 
             A 25 25 0 0 1 -10 -10 
             L -40 -10 
             A 25 25 0 0 0 -40 40 
             L -10 40" 
          fill="none" 
          stroke="white" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          transform="translate(15, 0)" />
  </g>
</svg>
