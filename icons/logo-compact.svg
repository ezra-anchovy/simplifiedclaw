<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Professional dark circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg-grad)" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#f97316" stroke-width="2" opacity="0.8"/>
  <!-- Lobster -->
  <text x="32" y="44" text-anchor="middle" font-size="32" filter="url(#shadow)">🦞</text>
</svg>