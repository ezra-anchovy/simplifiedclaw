<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    SimplifiedClaw V20: Precision Mechanical Foundation
    - Full Square Background (Anti-fringe)
    - V18 Mechanical C-Claws
    - V13 Clean S-Core (Centered, No overlap)
  -->
  <rect width="400" height="400" fill="#09090b" />
  
  <!-- "C" Claw shell -->
  <g transform="translate(0, 0)">
    <path d="M 280 80 A 155 155 0 1 0 280 320" 
          fill="none" 
          stroke="#f97316" 
          stroke-width="50" 
          stroke-linecap="butt" />
    <!-- Tapered Mechanical Tips -->
    <path d="M 280 55 L 330 35 Q 345 30 330 65 L 280 105 Z" fill="#f97316" />
    <path d="M 280 345 L 330 365 Q 345 370 330 335 L 280 295 Z" fill="#f97316" />
  </g>

  <!-- "S" Core - Clean, Scaled, and Symmetrical -->
  <g transform="translate(10, 0)">
    <path d="M 240 130 
             L 190 130 
             A 35 35 0 0 0 190 200 
             L 210 200 
             A 35 35 0 0 1 210 270 
             L 160 270" 
          fill="none" 
          stroke="white" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
