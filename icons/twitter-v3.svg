<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e85d35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44520;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#grad3)"/>
  
  <!-- Abstract claw marks (three diagonal slashes) -->
  <g filter="url(#shadow)">
    <path d="M 140 100 L 180 220" 
          stroke="#ffffff" 
          stroke-width="28" 
          stroke-linecap="round"/>
    <path d="M 180 90 L 220 210" 
          stroke="#ffffff" 
          stroke-width="32" 
          stroke-linecap="round"/>
    <path d="M 220 85 L 260 200" 
          stroke="#ffffff" 
          stroke-width="28" 
          stroke-linecap="round"/>
  </g>
  
  <!-- "SC" monogram in geometric box -->
  <rect x="120" y="230" width="160" height="140" rx="15" 
        fill="#ffffff" 
        opacity="0.95"/>
  
  <!-- "S" letter -->
  <path d="M 155 270 Q 145 270 145 280 Q 145 287 152 290 L 175 295 Q 185 297 185 305 Q 185 313 175 315 L 160 315 Q 152 315 152 320 L 152 323 Q 152 328 158 328 L 177 328 Q 190 328 195 318 Q 200 308 197 298 Q 194 288 182 285 L 160 280 Q 152 278 152 270 Q 152 262 162 262 L 175 262 Q 182 262 182 257 L 182 255 Q 182 250 176 250 L 160 250 Q 148 250 143 258 Q 140 262 142 267 Q 144 270 150 270 Z" 
        fill="#e85d35"/>
  
  <!-- "C" letter -->
  <path d="M 245 250 Q 215 250 205 270 Q 195 290 200 315 Q 205 340 230 345 Q 245 348 260 342 L 260 330 Q 248 335 237 333 Q 220 330 217 312 Q 214 294 222 277 Q 230 262 247 262 L 260 262 L 260 250 Z" 
        fill="#e85d35"/>
  
  <!-- Accent marks below -->
  <circle cx="160" cy="355" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="180" cy="355" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="200" cy="355" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="355" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="240" cy="355" r="4" fill="#ffffff" opacity="0.7"/>
</svg>