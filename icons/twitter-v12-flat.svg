<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Perfect Circular Background (Dark Navy) -->
  <circle cx="200" cy="200" r="200" fill="#09090b" />
  
  <!-- Centered 2D SC Monogram -->
  <g transform="translate(200, 200)">
    <!-- Bold Orange "C" (Claw) -->
    <path d="M 50 -120 
             A 130 130 0 1 0 50 120 
             L 110 150
             A 180 180 0 1 1 110 -150 
             Z" 
          fill="#f97316" 
          transform="translate(-35, 0)" />
    
    <!-- Bold White "S" -->
    <path d="M 30 -75 
             L -10 -75 
             A 30 30 0 0 0 -10 -15 
             L 10 -15 
             A 30 30 0 0 1 10 45 
             L -30 45" 
          fill="none" 
          stroke="white" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          transform="translate(15, 15)" />
  </g>
</svg>
