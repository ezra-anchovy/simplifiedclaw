<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sphere Lighting -->
    <radialGradient id="sphere-fill" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#2a3a4a" />
      <stop offset="100%" style="stop-color:#020617" />
    </radialGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c" />
      <stop offset="100%" style="stop-color:#ea580c" />
    </linearGradient>
    <!-- Specular Highlight -->
    <radialGradient id="highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Circle (The Ball) -->
  <circle cx="200" cy="200" r="200" fill="url(#sphere-fill)" />

  <!-- Oblique Transformation Group -->
  <!-- 
    Rotation + Skew + Scale to simulate sphere surface mapping 
    from an oblique angle.
  -->
  <g transform="translate(190, 210) rotate(-10) skewX(5) scale(1.1, 0.95)">
    
    <!-- The "C" (Claw Pincer) -->
    <path d="M 60 -120 
             A 120 120 0 1 0 60 120 
             L 110 145
             A 165 165 0 1 1 110 -145 
             Z" 
          fill="url(#orange-grad)" 
          transform="translate(-30, 0)" />
          
    <!-- The "S" (Mathematically derived, properly oriented) -->
    <path d="M 25 -75 
             L -15 -75 
             A 25 25 0 0 0 -15 -15 
             L 15 -15 
             A 25 25 0 0 1 15 45 
             L -25 45" 
          fill="none" 
          stroke="white" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          transform="translate(10, 15)" />
  </g>

  <!-- Surface Specular Reflection -->
  <ellipse cx="150" cy="150" rx="80" ry="40" fill="url(#highlight)" transform="rotate(-35, 150, 150)" />
</svg>
