<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobster Logo Variations | Preview</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 40px;
            text-align: center;
        }
        h1 { margin-bottom: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px 20px;
        }
        .card img {
            width: 100px;
            height: 100px;
            margin-bottom: 16px;
        }
        .card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        a { color: #3b82f6; }
    </style>
</head>
<body>
    <h1>🦞 Lobster Logo Variations</h1>
    <p style="margin-bottom: 40px; color: #94a3b8;">Pick your favorite for the B2B site. All use coral/orange (#f97316) on dark blue.</p>
    
    <div class="grid">
        <div class="card">
            <img src="icons/lobster-diagonal.svg" alt="Diagonal">
            <h3>Diagonal</h3>
            <p>45° rotated, dynamic angle</p>
        </div>
        <div class="card">
            <img src="icons/lobster-claw-only.svg" alt="Claw Only">
            <h3>Claw Only</h3>
            <p>Just the pincer, vertical accent</p>
        </div>
        <div class="card">
            <img src="icons/lobster-minimal.svg" alt="Minimal">
            <h3>Minimal</h3>
            <p>Geometric silhouette</p>
        </div>
        <div class="card">
            <img src="icons/lobster-badge.svg" alt="Badge">
            <h3>Badge</h3>
            <p>Circular seal format</p>
        </div>
    </div>
    
    <p style="margin-top: 40px;"><a href="index.html">← Back to SimplifiedClaw</a></p>
</body>
</html>
